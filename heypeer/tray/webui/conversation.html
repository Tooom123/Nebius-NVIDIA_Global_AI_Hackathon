<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --level: 0;
    /* Blue -> violet -> magenta, the palette from the reference design. */
    --c1: #4f8cff;
    --c2: #7b4dff;
    --c3: #e040fb;
    --drift-speed: 9s;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }

  /* Full-bleed on purpose: this page never defines the blob's outline. The
     window itself is clipped to the blob silhouette every frame by
     SetWindowRgn (see debug_window.py), so anything painted outside that
     outline simply isn't part of the window. Clipping here as well would
     mean two independent notions of the shape, which is exactly the bug the
     region-driven design removes — and any area this doesn't paint would
     show through as the window's grey background instead. */
  .blob {
    position: absolute;
    inset: 0;
    background:
      /* Off-centre highlight, so the volume reads as lit from one side
         rather than as a flat disc. */
      radial-gradient(circle at 32% 26%,
        rgba(255, 255, 255, 0.30) 0%,
        rgba(255, 255, 255, 0.10) 26%,
        transparent 55%),
      linear-gradient(135deg, var(--c1) 0%, var(--c2) 50%, var(--c3) 100%);
    background-size: 160% 160%, 190% 190%;
    animation: drift var(--drift-speed) ease-in-out infinite;
    /* Brightness lifts with the voice. The *size* reaction lives in the
       window region (blob_shape.blob_points takes the level), so this only
       has to add the glow, not fake the motion. */
    filter: brightness(calc(1 + var(--level) * 0.42))
            saturate(calc(1 + var(--level) * 0.45));
    transition: filter 0.12s ease-out, background 0.5s ease;
  }

  /* Slow internal drift of the gradients, independent of the outline's own
     morphing — together they keep it from ever looking static. */
  @keyframes drift {
    0%, 100% { background-position: 20% 30%, 0% 50%; }
    50%      { background-position: 70% 65%, 100% 50%; }
  }
</style>
</head>
<body>
  <div class="blob" id="blob"></div>

<script>
  // Palette and drift speed per state. The silhouette is identical across
  // states, so transitions read as one object reacting rather than a
  // different indicator appearing.
  const STATE_STYLE = {
    idle:      { c1: "#3a4a60", c2: "#4a4a6a", c3: "#6a4a7a", speed: "12s" },
    listening: { c1: "#4f8cff", c2: "#7b4dff", c3: "#e040fb", speed: "9s" },
    recording: { c1: "#4f8cff", c2: "#8b5cff", c3: "#ff4fd8", speed: "3.4s" },
    thinking:  { c1: "#5b6dff", c2: "#9b4dff", c3: "#d040fb", speed: "1.9s" },
    speaking:  { c1: "#5fa8ff", c2: "#a05cff", c3: "#ff6ae0", speed: "5s" },
  };

  const root = document.documentElement;

  function setLevel(level) {
    root.style.setProperty("--level", Math.max(0, Math.min(1, level)));
  }

  function setState(state) {
    const style = STATE_STYLE[state] || STATE_STYLE.idle;
    root.style.setProperty("--c1", style.c1);
    root.style.setProperty("--c2", style.c2);
    root.style.setProperty("--c3", style.c3);
    root.style.setProperty("--drift-speed", style.speed);
    if (state !== "recording") setLevel(0);
  }

  setState("idle");
</script>
</body>
</html>
