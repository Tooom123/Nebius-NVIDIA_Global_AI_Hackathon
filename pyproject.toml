[project]
name = "heypeer"
version = "0.1.0"
description = "Always-on French/English voice assistant for Windows that acts on your machine - files, code, music, timers - with wake word, speech-to-text and speech all running locally."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heypeer*"]
